<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>AOS Click Probe</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #111827;
        color: #f9fafb;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        display: grid;
        place-items: center;
      }

      button {
        width: min(72vw, 720px);
        height: min(52vh, 420px);
        border: 0;
        border-radius: 8px;
        background: #0f766e;
        color: white;
        font-size: 44px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <button id="probe">clicks: 0</button>
    <script>
      let clicks = 0;
      document.getElementById("probe").addEventListener("click", () => {
        clicks += 1;
        document.getElementById("probe").textContent = `clicks: ${clicks}`;
      });
    </script>
  </body>
</html>
